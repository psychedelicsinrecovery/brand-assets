<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Brand Assets</title>
  <desc id="d">Logos, marks and how to use them. Get it here. The picture: a 4-sided figure draws itself and its corners arrive one by one. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d153a"/><stop offset="1" stop-color="#111126"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#7c3aed"/><stop offset="0.50" stop-color="#7c55c4"/><stop offset="1.00" stop-color="#baa6e4"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#7c55c4" stop-opacity="0"/><stop offset=".35" stop-color="#7c55c4"/><stop offset="1" stop-color="#baa6e4"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <path d="M955.4 179.0 L902.0 124.4 L956.5 71.0 L1009.9 125.6Z" fill="#302256" fill-opacity=".35" stroke="#483278" stroke-width="1.5"/>
    <path d="M955.9 125.0L1018.9 189.3" stroke="#302256" stroke-width="1"/>
    <path d="M955.9 125.0L891.7 188.0" stroke="#302256" stroke-width="1"/>
    <path d="M955.9 125.0L893.0 60.7" stroke="#302256" stroke-width="1"/>
    <path d="M955.9 125.0L1020.2 62.0" stroke="#302256" stroke-width="1"/>
    <path class="draw" pathLength="100" d="M1018.9 189.3 L891.7 188.0 L893.0 60.7 L1020.2 62.0Z" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.30s"/>
    <circle class="arrive" style="animation-delay:0.35s" cx="1018.9" cy="189.3" r="7" fill="#111126" stroke="#baa6e4" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:1.07s" cx="891.7" cy="188.0" r="7" fill="#111126" stroke="#baa6e4" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:1.80s" cx="893.0" cy="60.7" r="7" fill="#111126" stroke="#baa6e4" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:2.52s" cx="1020.2" cy="62.0" r="7" fill="#111126" stroke="#baa6e4" stroke-width="2.5"/>
    <circle class="halo" cx="955.9" cy="125.0" r="12" fill="none" stroke="#baa6e4" stroke-width="2"/>
    <circle class="breathe" cx="955.9" cy="125.0" r="10" fill="#7c55c4"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#3b1f6e"/><rect x="300.0" y="248" width="300.5" height="12" fill="#7c3aed"/><rect x="600.0" y="248" width="300.5" height="12" fill="#5b2bb5"/><rect x="900.0" y="248" width="300.5" height="12" fill="#ede9fe"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="72.0" fill="#9373ce" font-size="15" font-weight="700" letter-spacing=".6">PIR® · Psychedelics In Recovery™</text><text x="56" y="137.6" fill="#ede9fe" font-size="60" font-weight="700" letter-spacing="-.5">Brand Assets</text><text x="56" y="181.4" fill="#d0cbe3" font-size="23">Logos, marks and how to use them. Get it here.</text></g>
  </g>
</svg>
